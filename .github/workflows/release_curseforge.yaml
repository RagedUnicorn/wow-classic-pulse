name: Release CurseForge
on: [workflow_dispatch]

jobs:
  # A release never publishes from a red ref: both gates are the PR workflows,
  # called as reusable workflows so the steps live in one place.
  lint:
    uses: ./.github/workflows/lint.yaml
  test:
    uses: ./.github/workflows/test.yaml
  curseforge-release-job:
    needs: [lint, test]
    name: CurseForge Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java and Maven
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Cache Local Maven Repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Package Production
        run: mvn generate-resources -D generate.sources.overwrite=true -P release
      # Builds the zip the publish step uploads (same profile, same tree) without
      # publishing it, and fails when the AddOn could not load from it.
      - name: Verify Package Contents
        run: |
          mvn --batch-mode --no-transfer-progress assembly:single -P deploy-curseforge
          contents=$(unzip -Z1 target/Pulse.zip)
          root="Pulse/"
          if ! grep -qx "${root}Pulse.toc" <<< "$contents"; then
            echo "::error::package is missing ${root}Pulse.toc"
            exit 1
          fi
          for folder in code gui localization; do
            if ! grep -q "^${root}${folder}/.*\.lua$" <<< "$contents"; then
              echo "::error::package is missing the ${root}${folder}/ folder"
              exit 1
            fi
          done
      - name: Publish Package to CurseForge
        run: |
          mvn --batch-mode --no-transfer-progress \
          package \
          -P deploy-curseforge \
          -D curseforge.auth-token=$TOKEN_CURSEFORGE
        env:
          TOKEN_CURSEFORGE: ${{ secrets.TOKEN_CURSEFORGE }}
